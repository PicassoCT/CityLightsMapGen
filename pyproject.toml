[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-map-generator"
version = "0.3.0"
description = "Deterministic original-city maps and experimental map-contained startup for MOSAIC"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["lupa>=2.4,<3"]
runtime = ["lupa>=2.4,<3"]

[project.scripts]
mosaic-mapgen = "mosaic_mapgen.cli:main"

[tool.setuptools.packages.find]
include = ["mosaic_mapgen*"]

[tool.setuptools.package-data]
mosaic_mapgen = ["templates/**/*.lua", "runtime/*.lua"]
