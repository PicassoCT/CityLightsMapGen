name: Generator tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[test]
      - run: python -m unittest discover -s tests -v
      - run: python -m mosaic_mapgen build --city examples/berlin-fixture.geojson --config examples/berlin.json --out build/demo
      - uses: actions/upload-artifact@v4
        with:
          name: mirrored-demo-${{ matrix.os }}-${{ matrix.python }}
          path: |
            build/demo/MOSAIC_city.sdz
            build/demo/preview.png
            build/demo/manifest.json
            build/demo/balance.json
